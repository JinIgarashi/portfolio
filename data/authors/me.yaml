      📍 Tokyo, Japan · 🔗 <https://www.kkc.co.jp/english/index.html>

      Conducted the following projects funded by the Japan International Cooperation Agency (JICA).

      - [The Project for Strengthening Operation and Maintenance of Rural Water Supply Systems in Rwanda (RWASOM)](projects/201806-rwasom/) (06/2018 – 12/2019)
      - [Survey for the Establishment of the Experimental Field for the GNSS System Development in the Kingdom of Thailand](projects/201811-thai_cors/) (11/2018 – 11/2019)
      - [Preparatory Survey for the Project for Strengthening Nzove-Ntora Principal Water Transmission Pipeline in Kigali City, Rwanda](projects/201710-nzove-ntora/) (10/2017 – 11/2018)

      In the RWASOM project, conducted training workshops for data collection and sharing with FOSS4G applications, then designed and created the GIS database and data sharing platform for rural water supply management. Collaborated with Rwandan colleagues to complete the mapping of all water supply systems in the country. The system uses PostGIS, Lizmap/QGIS Server, QGIS Desktop, QField and Garmin GPS.

